name: Build JS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: v24.22.1
          cache: pnpm
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build:packages
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Run Packages CI
        run: pnpm --filter "./packages/**" --workspace-concurrency=1 run ci

  react-components-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Fixture setup extracts the #72 parity baseline from the flat-styles-parity-baseline tag;
        # fetch-depth: 0 fetches every tag, and fetch-tags says so explicitly.
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: v24.22.1
          cache: pnpm
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The react-ui benches compare against the workspace's @openuidev/react-ui, so build it and
      # its workspace dependencies too.
      - name: Build react-components and react-ui
        run: pnpm --filter "@openuidev/react-components..." --filter "@openuidev/react-ui..." run build

      - name: Install Chromium
        run: pnpm --filter @openuidev/react-components exec playwright install --with-deps chromium

      - name: Run react-components browser tests
        run: pnpm --filter @openuidev/react-components run test:browser
