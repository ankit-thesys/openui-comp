[package]
name = "openui-lang"
version = "0.1.0"
edition = "2021"
description = "Rust port of the OpenUI Lang parser (@openuidev/lang-core)"
license = "MIT"

[dependencies]
indexmap = "2"
ryu-js = "1"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]

[profile.release]
lto = true
codegen-units = 1
