<!doctype html><meta charset="utf-8"><title>Isolated bench renderer documents</title><style>html,body{margin:0;background:#fff}body{display:flex;gap:16px}iframe{border:0;flex-shrink:0}</style><iframe title="Existing library" src="/legacy.html"></iframe><iframe title="Migrated library" src="/migrated.html"></iframe><script>window.benchReady=new Set();window.benchEvents=[];addEventListener("message",event=>{if(event.origin!==location.origin||event.data?.channel!=="openui-component-comparison/v1")return;const frames=[...document.querySelectorAll("iframe")];const pane=frames.findIndex(f=>f.contentWindow===event.source);if(pane<0)return;if(event.data.type==="ready")window.benchReady.add(pane);if((event.data.type==="action"||event.data.type==="state")&&event.data.viewId===window.benchViewId)window.benchEvents.push({pane,...event.data});});</script>
